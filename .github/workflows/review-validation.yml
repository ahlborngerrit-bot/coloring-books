name: Generation safety proposal validation

on:
  push:
    branches:
      - proposal/generation-safety-2026-10-12
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coloring-books-generation-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install project dependencies and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: Compile generator modules
        run: python -m compileall -q coloring_book_generator.py complete_book_workflow.py cover_generator.py batch_generator.py coloring_book_generator_parallel.py
      - name: Run offline regression tests only
        run: python -m pytest -q test_quality_assurance.py test_generation_limits.py -k "not integration_single_page"
